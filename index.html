<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Socratex personal portfolio map: projects, work, AI pipeline, music, game development, and contact."
    >
    <meta name="theme-color" content="#031018">
    <title>Socratex | Portfolio Map</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="site-shell" aria-labelledby="page-title">
      <h1 id="page-title" class="sr-only">Socratex personal portfolio map</h1>

      <section class="map-stage" aria-label="Interactive spatial map of Socratex and projects">
        <video class="background-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
          <source src="assets/plexus.mp4" type="video/mp4">
        </video>
        <div class="background-shade" aria-hidden="true"></div>
        <div class="tile-light-field" aria-hidden="true"></div>

        <div class="logo-tile" aria-label="Socratex">
          <span class="hex-content">
            <img class="logo-mark" src="assets/logo.png" alt="Socratex logo">
            <span class="logo-fallback" aria-hidden="true">SOCRATEX</span>
          </span>
        </div>

        <nav class="node-layer" aria-label="Portfolio sections"></nav>
        <nav class="subnode-layer" aria-label="Expanded portfolio sections"></nav>

        <section class="content-overlay" aria-labelledby="content-title" aria-modal="true" role="dialog" hidden>
          <div class="content-panel">
            <button class="content-close" type="button" aria-label="Close content panel">x</button>
            <div class="content-heading">
              <h2 id="content-title" class="content-reveal">Section</h2>
              <button id="details-toggle" class="details-toggle content-reveal" type="button" aria-label="Expand all details" hidden>
                <svg class="details-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 9l5-5 5 5"></path>
                  <path d="M7 15l5 5 5-5"></path>
                </svg>
              </button>
            </div>
            <a id="content-link" class="content-link content-reveal" href="#" target="_blank" rel="noopener noreferrer" hidden>
              Open link
            </a>
            <figure id="content-media" class="content-media content-reveal" hidden>
              <img id="content-image" alt="">
            </figure>
            <div id="content-copy" class="content-copy"></div>
          </div>
        </section>
      </section>
    </main>

    <div class="toast" role="status" aria-live="polite" aria-atomic="true" hidden>
      <span class="toast-text">Mail copied</span>
    </div>

    <script src="js/app.js" defer></script>
  </body>
</html>
