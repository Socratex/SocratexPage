<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Socratex personal portfolio map: projects, work, AI pipeline, music, game development, and contact."
    >
    <meta name="theme-color" content="#031018">
    <title>Socratex | Portfolio Map</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="site-shell" aria-labelledby="page-title">
      <h1 id="page-title" class="sr-only">Socratex personal portfolio map</h1>

      <section class="map-stage" aria-label="Interactive spatial map of Socratex and projects">
        <div class="ambient-grid" aria-hidden="true"></div>

        <div class="logo-tile" aria-label="Socratex">
          <span class="hex-content">
            <img class="logo-mark" src="assets/logo.png" alt="Socratex logo">
            <span class="logo-fallback" aria-hidden="true">SOCRATEX</span>
          </span>
        </div>

        <nav class="node-layer" aria-label="Portfolio sections"></nav>

        <aside class="section-panel" aria-live="polite" aria-label="Selected section">
          <span class="panel-kicker">Selected node</span>
          <strong id="selected-section">Socratex map online</strong>
        </aside>
      </section>
    </main>

    <script src="js/app.js" defer></script>
  </body>
</html>
